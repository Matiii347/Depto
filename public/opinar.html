<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dejar una Reseña - Depto Ingleses</title>
  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: hsl(355, 82%, 58%);
      --primary-hover: hsl(355, 80%, 50%);
      --dark: hsl(220, 20%, 15%);
      --light: hsl(210, 25%, 98%);
      --text-main: hsl(220, 15%, 25%);
      --text-muted: hsl(220, 10%, 50%);
      --border-color: rgba(0, 0, 0, 0.08);
      --border-radius-lg: 16px;
      --border-radius-md: 12px;
      --border-radius-sm: 8px;
      --shadow-lg: 0 15px 40px rgba(0, 0, 0, 0.08);
      --transition-smooth: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--light);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: white;
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius-lg);
      padding: 40px;
      box-shadow: var(--shadow-lg);
      text-align: center;
    }

    .logo-header {
      color: var(--primary);
      font-size: 32px;
      margin-bottom: 12px;
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      color: var(--dark);
      margin-bottom: 8px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 30px;
    }

    .error-card {
      color: #e74c3c;
      background-color: #fdf2f2;
      padding: 16px;
      border-radius: var(--border-radius-sm);
      border: 1px solid #f5b7b1;
      margin-bottom: 20px;
      display: none;
      font-size: 14px;
      font-weight: 500;
    }

    .success-card {
      display: none;
    }

    .success-card i {
      color: #2ecc71;
      font-size: 64px;
      margin-bottom: 20px;
    }

    .success-card h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 22px;
      margin-bottom: 10px;
    }

    .success-card p {
      color: var(--text-muted);
      font-size: 15px;
      margin-bottom: 24px;
    }

    /* Star Rating CSS */
    .rating-container {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
      flex-direction: row-reverse; /* For hover CSS sibling selector trick */
    }

    .star-input { display: none; }

    .star-label {
      font-size: 36px;
      color: #d1d5db;
      cursor: pointer;
      transition: var(--transition-smooth);
    }

    .star-label:hover,
    .star-label:hover ~ .star-label,
    .star-input:checked ~ .star-label {
      color: #f1c40f;
    }

    /* Textarea and Inputs */
    .form-group {
      display: flex;
      flex-direction: column;
      text-align: left;
      gap: 8px;
      margin-bottom: 24px;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--dark);
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 14px;
      border-radius: var(--border-radius-sm);
      border: 1px solid var(--border-color);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      outline: none;
      resize: none;
      transition: var(--transition-smooth);
    }

    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px hsla(355, 82%, 58%, 0.15);
    }

    .btn-submit {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 16px;
      border-radius: var(--border-radius-md);
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition-smooth);
      box-shadow: 0 4px 12px hsla(355, 82%, 58%, 0.2);
    }

    .btn-submit:hover:not(:disabled) {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px hsla(355, 82%, 58%, 0.3);
    }

    .btn-submit:disabled {
      background-color: #d1d5db;
      color: #9ca3af;
      cursor: not-allowed;
      box-shadow: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Feedback Form Content -->
    <div id="feedback-form-section">
      <div class="logo-header">
        <i class="fa-solid fa-umbrella-beach"></i>
      </div>
      <h1>¿Cómo estuvo tu estadía?</h1>
      <p class="subtitle">Tu comentario nos ayuda un montón a seguir mejorando y nos sirve para el boca a boca.</p>
      
      <!-- Error notification -->
      <div id="error-box" class="error-card"></div>

      <div class="form">
        <!-- Interactive Stars -->
        <div class="form-group">
          <label style="text-align: center;">Calificación</label>
          <div class="rating-container">
            <input type="radio" name="rating" id="star5" value="5" class="star-input"><label for="star5" class="star-label"><i class="fa-solid fa-star"></i></label>
            <input type="radio" name="rating" id="star4" value="4" class="star-input"><label for="star4" class="star-label"><i class="fa-solid fa-star"></i></label>
            <input type="radio" name="rating" id="star3" value="3" class="star-input"><label for="star3" class="star-label"><i class="fa-solid fa-star"></i></label>
            <input type="radio" name="rating" id="star2" value="2" class="star-input"><label for="star2" class="star-label"><i class="fa-solid fa-star"></i></label>
            <input type="radio" name="rating" id="star1" value="1" class="star-input"><label for="star1" class="star-label"><i class="fa-solid fa-star"></i></label>
          </div>
        </div>

        <div class="form-group">
          <label for="review-text">Tu comentario (Opcional)</label>
          <textarea id="review-text" placeholder="Escribe aquí tu experiencia sobre el departamento, la ubicación, la limpieza..."></textarea>
        </div>

        <button id="btn-send-review" class="btn-submit" disabled>Enviar Reseña</button>
      </div>
    </div>

    <!-- Success Content -->
    <div id="success-section" class="success-card">
      <i class="fa-solid fa-circle-check"></i>
      <h2>¡Reseña Enviada!</h2>
      <p id="success-msg">Muchas gracias por dejarnos tu comentario. Se mostrará en la página principal una vez aprobado.</p>
      <button onclick="window.close()" class="btn-submit">Cerrar Ventana</button>
    </div>
  </div>

  <script src="opinar.js"></script>
</body>
</html>
